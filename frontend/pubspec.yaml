name: songkrous
description: "SONGKROUS (សង្គ្រោះ) — emergency help app for Phnom Penh."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.1.4
  flutter_riverpod: ^3.5.0
  google_fonts: ^9.0.0
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_localizations:
    sdk: flutter
  share_plus: ^13.3.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
